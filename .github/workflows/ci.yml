# CI pública por princípio: qualquer pessoa vê o que passa e o que falha.
name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check
        working-directory: contracts

      # O gate de tamanho recorta test/**: os limites EIP-170 e EIP-3860 valem para o que chega a
      # uma chain, e o `--sizes` ja descarta quem herda Test/Script. O `Handler` de invariante nao
      # herda nenhum dos dois de proposito, entao entraria no relatorio com o initcode dos nove
      # contratos que o construtor dele instancia.
      - run: forge build --sizes --skip 'test/**'
        working-directory: contracts
      - run: forge test -vvv
        working-directory: contracts

      # abi/ e commitado para que um consumidor nao precise de Foundry, e arquivo gerado commitado
      # apodrece em silencio. Roda o mesmo script que o contribuidor roda, entao a checagem compara
      # conteudo e nao dois modos de produzir.
      - name: ABIs are current
        working-directory: contracts
        run: |
          sh script/abi.sh
          git diff --exit-code -- abi/ \
            || { echo "::error::abi/ esta velho — rode 'sh script/abi.sh' e commite o resultado"; exit 1; }
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        working-directory: engine
      - run: npm run typecheck
        working-directory: engine
      - run: npm test
        working-directory: engine

  # Os portoes do site. Este job substituiu `surfaces`, que rodava UM dos oito.
  #
  # Medido em 2026-08-22 sobre a arvore 3d855c92: sete dos oito portoes em
  # scripts/ nao eram invocados por workflow nenhum. Existiam, e tres deles
  # estavam vermelhos. site/console/index.html chega a afirmar para quem le a
  # pagina que check-console-abi.mjs "fails the build" — e ele nao estava ligado
  # a coisa alguma.
  #
  # A lista NAO mora aqui: mora em scripts/portoes.mjs, e e a mesma que roda na
  # maquina de quem contribui. Duas listas divergem no primeiro dia em que
  # alguem acrescenta um portao e esquece a outra.
  portoes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/portoes.mjs

  # Separado de proposito: este le RPC publico. Uma queda de RPC e
  # indistinguivel de uma regressao de codigo quando as duas aparecem como o
  # mesmo X vermelho na lista do PR, e a leitura errada custa uma investigacao
  # inteira antes de chegar em "o no estava fora do ar".
  portoes-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/portoes.mjs --so-rede

  # Static analysis of the contracts. Fails the build only on HIGH findings;
  # the MEDIUM/INFO items are already triaged in docs/audits (Medusa report).
  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
      # A base de triagem silencia DOIS achados por conteudo, nunca o detector: os dois
      # reentrancy-balance em Executor.run sao falso-positivo porque a trava e `transient`
      # (EIP-1153) e o Slither 0.11.6 nao modela isso. Verificado: com a base, zero HIGH; sem
      # ela, os dois voltam. Um reentrancy-balance novo em qualquer outro lugar ainda reprova.
      - uses: crytic/slither-action@v0.4.0
        with:
          target: contracts/
          slither-config: contracts/slither.config.json
          slither-args: --triage-database contracts/slither.db.json
          fail-on: high
