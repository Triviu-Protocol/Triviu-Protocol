  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;

    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);

    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

(--acc)\">open by design<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"trv-section trv-contained\" id=\"origin\" data-tone=\"168\" style=\"width:min(1240px,calc(100% - 40px));margin:auto;padding:110px 0\">\n  <div class=\"trv-grid trv-split-grid\" style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.48fr);gap:44px;align-items:end;margin-bottom:44px\">\n    <div>\n      <span style=\"font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--acc)\">01 · origin of the mark<\u002Fspan>\n      <h2 style=\"margin:12px 0 0;font-size:clamp(2.1rem,4.4vw,4.5rem);line-height:1;letter-spacing:-.06em\">Three roads.<br>One open path.<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"color:#c3cbc5;font-size:15.5px\">TRIVIU comes from <em>trivium<\u002Fem>: the meeting of three ways. The mark draws that origin as a triangle that is alive, continuous and deliberately unfinished.<\u002Fp>\n  <\u002Fdiv>  <div class=\"trv-grid trv-auto-grid trv-auto-320\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px\">\n    <article class=\"trv-tall-card trv-grid\" style=\"position:relative;min-height:520px;display:grid;place-items:center;overflow:hidden;border-radius:32px;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 42%),rgba(21,24,22,.92);border:1px solid var(--line)\">\n      <div style=\"position:absolute;inset:11%;border:1px solid color-mix(in srgb,var(--acc) 15%,transparent);border-radius:50%\"><\u002Fdiv>\n      <div style=\"position:absolute;inset:25%;border:1px dashed color-mix(in srgb,var(--acc) 15%,transparent);border-radius:50%\"><\u002Fdiv>\n      <span style=\"position:absolute;z-index:2;top:7%;left:50%;transform:translateX(-50%);text-align:center;padding:11px 14px;border-radius:14px;background:#101312;border:1px solid var(--line);font-family:var(--mono);font-size:11.5px;line-height:1.45;color:#c3cbc5\"><b style=\"display:block;color:#f5f7f3;font-size:12.5px;letter-spacing:.04em\">DECENTRALISATION<\u002Fb>distributed control<\u002Fspan>\n      <span style=\"position:absolute;z-index:2;right:3%;bottom:18%;padding:11px 14px;border-radius:14px;background:#101312;border:1px solid var(--line);font-family:var(--mono);font-size:11.5px;line-height:1.45;color:#c3cbc5\"><b style=\"display:block;color:#f5f7f3;font-size:12.5px;letter-spacing:.04em\">SECURITY<\u002Fb>verifiable integrity<\u002Fspan>\n      <span style=\"position:absolute;z-index:2;left:3%;bottom:18%;padding:11px 14px;border-radius:14px;background:#101312;border:1px solid var(--line);font-family:var(--mono);font-size:11.5px;line-height:1.45;color:#c3cbc5\"><b style=\"display:block;color:#f5f7f3;font-size:12.5px;letter-spacing:.04em\">SCALABILITY<\u002Fb>growth with limits<\u002Fspan>\n      <div style=\"position:relative;z-index:1;width:min(58%,290px)\"><svg sc-camel-view-box=\"0 0 320 296\" style=\"width:100%;height:auto;color:var(--acc)\" aria-hidden=\"true\">\n        <path d=\"M75 168 L160 20 L245 168 L104 168\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".24\" stroke-dasharray=\"2 11\"><\u002Fpath>\n        <path d=\"M75 168 L160 20 L245 168 L104 168\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-dasharray=\"68 390\" style=\"animation:route 5.2s linear infinite\"><\u002Fpath>\n        <circle cx=\"75\" cy=\"168\" r=\"9\" fill=\"#080909\" stroke=\"currentColor\" stroke-width=\"4\"><\u002Fcircle>\n        <circle cx=\"160\" cy=\"20\" r=\"9\" fill=\"currentColor\"><\u002Fcircle>\n        <circle cx=\"245\" cy=\"168\" r=\"9\" fill=\"currentColor\"><\u002Fcircle>\n      <\u002Fsvg><\u002Fdiv>\n    <\u002Farticle>\n    <article style=\"padding:clamp(28px,5vw,52px);border-radius:32px;background:var(--acc);color:var(--ink)\">\n      <span style=\"font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--ink)\">Triangle motion<\u002Fspan>\n      <h2 style=\"margin:12px 0 18px;font-size:clamp(2.2rem,4.8vw,4.6rem);line-height:1;letter-spacing:-.06em\">The mark never stops learning.<\u002Fh2>\n      <p style=\"color:var(--ink);font-size:16.5px\">Motion runs from the origin to the apex, reaches the third point and returns along the base without closing the shape. That opening is the argument: distributed systems keep evolving through choices, evidence and new context.<\u002Fp>\n      <div class=\"trv-grid\" style=\"display:grid;margin-top:30px;border-top:1px solid color-mix(in srgb,var(--ink) 24%,transparent)\">\n        <div class=\"trv-grid trv-row-grid\" style=\"display:grid;grid-template-columns:42px 1fr;gap:12px;padding:16px 0;border-bottom:1px solid color-mix(in srgb,var(--ink) 24%,transparent)\">\n          <i style=\"font-family:var(--mono);font-style:normal;font-weight:700;font-size:11.5px\">01<\u002Fi>\n          <span><b style=\"display:block\">Decentralisation<\u002Fb><span style=\"display:block;font-size:13.5px;color:var(--ink)\">Legible rules and distributed control.<\u002Fspan><\u002Fspan>\n        <\u002Fdiv><div class=\"trv-grid trv-row-grid\" style=\"display:grid;grid-template-columns:42px 1fr;gap:12px;padding:16px 0;border-bottom:1px solid color-mix(in srgb,var(--ink) 24%,transparent)\">\n          <i style=\"font-family:var(--mono);font-style:normal;font-weight:700;font-size:11.5px\">02<\u002Fi>\n          <span><b style=\"display:block\">Security<\u002Fb><span style=\"display:block;font-size:13.5px;color:var(--ink)\">Validation, integrity and explicit conditions.<\u002Fspan><\u002Fspan>\n        <\u002Fdiv><div class=\"trv-grid trv-row-grid\" style=\"display:grid;grid-template-columns:42px 1fr;gap:12px;padding:16px 0;border-bottom:1px solid color-mix(in srgb,var(--ink) 24%,transparent)\">\n          <i style=\"font-family:var(--mono);font-style:normal yle=\"position:relative;padding:15px;border-radius:15px;background:rgba(255,255,255,.04);border:1px solid var(--line)\">\n              <span style=\"position:absolute;top:9px;right:10px;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.12em;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:{{ stat.color }}\">{{ stat.tag }}<\u002Fspan>\n              <span style=\"display:block;color:var(--mut);font-size:11.5px;padding-right:76px\">{{ stat.label }}<\u002Fspan>\n              <b style=\"display:block;margin-top:5px;font-family:var(--mono);font-size:12.5px;line-height:1.45;word-break:break-word\">{{ stat.value }}<\u002Fb>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div class=\"trv-flex-wrap\" style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--mut);text-transform:uppercase\">\n          <span><i style=\"display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--acc)\"><\u002Fi>stated — in the reference material<\u002Fspan>\n          <span><i style=\"display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--amber)\"><\u002Fi>pending — awaiting evidence<\u002Fspan>\n          <span><i style=\"display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--red)\"><\u002Fi>spec — confirm against the contract<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin-top:20px;color:var(--mut);font-size:12px\">{{ current.note }}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Farticle>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"trv-section trv-contained\" id=\"commons\" data-tone=\"224\" style=\"width:min(1240px,calc(100% - 40px));margin:auto;padding:110px 0\">\n  <div class=\"trv-grid trv-auto-grid trv-auto-320\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px\">\n    <article style=\"padding:38px;border-radius:32px;background:var(--acc);color:var(--ink);display:flex;flex-direction:column\">\n      <span style=\"font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--ink)\">03 · strategy commons<\u002Fspan>\n      <h2 style=\"margin:12px 0 18px;font-size:clamp(2.1rem,4.4vw,4.2rem);line-height:1;letter-spacing:-.06em\">Ideas that can be understood.<\u002Fh2>\n      <p style=\"color:var(--ink);font-size:16px\">Discover authors, compare descriptions, follow versions. Following stays a social act of observation — it never authorises anything financial.<\u002Fp>\n      <div style=\"margin:auto;width:136px\"><svg sc-camel-view-box=\"0 0 320 296\" style=\"width:100%;height:auto;color:var(--ink)\" aria-hidden=\"true\">\n        <path d=\"M75 168 L160 20 L245 168 L104 168\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".24\" stroke-dasharray=\"2 11\"><\u002Fpath>\n        <path d=\"M75 168 L160 20 L245 168 L104 168\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-dasharray=\"68 390\" style=\"animation:route 5.2s linear infinite\"><\u002Fpath>\n        <circle cx=\"75\" cy=\"168\" r=\"9\" fill=\"var(--acc)\" stroke=\"currentColor\" stroke-width=\"4\"><\u002Fcircle>\n        <circle cx=\"160\" cy=\"20\" r=\"9\" fill=\"currentColor\"><\u002Fcircle>\n        <circle cx=\"245\" cy=\"168\" r=\"9\" fill=\"currentColor\"><\u002Fcircle>\n      <\u002Fsvg><\u002Fdiv>\n      <a href=\"#surfaces\" style=\"min-height:46px;align-self:flex-start;display:inline-flex;align-items:center;gap:9px;padding:12px 20px;border-radius:999px;background:var(--ink);color:var(--acc);font-size:13px;font-weight:800\">Meet the Commons ↗<\u002Fa>\n    <\u002Farticle>\n    <div class=\"trv-grid\" style=\"display:grid;gap:12px;align-content:start\">\n      <article style=\"padding:22px;border-radius:22px;background:rgba(21,24,22,.92);border:1px solid var(--line);transition:.2s ease\" style-hover=\"border-color:color-mix(in srgb,var(--acc) 40%,var(--line));transform:translateX(4px)\">\n        <div class=\"trv-flex-wrap\" style=\"display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap\">\n          <span style=\"color:var(--mut);font-family:var(--mono);font-size:11px;font-weight:700\">DEFAULT · TRIVIU<\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;min-height:30px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;color:var(--mut);font-family:var(--mono);font-size:10.5px;font-weight:700\">DEMO<\u002Fspan>\n        <\u002Fdiv>\n        <h3 style=\"margin:13px 0 7px;font-size:1.16rem;line-height:1.25\">Reference strategies<\u002Fh3>\n        <p style=\"color:#c3cbc5;font-size:14.5px\">Configurations shipped by the protocol to demonstrate parameters, limits and decision states.<\u002Fp>\n        <div class=\"trv-grid trv-auto-grid trv-auto-96\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:7px;margin-top:18px\"><div style=\"padding:10px;background:var(--s2);border-radius:12px\"><span style=\"display:block;font-size:10.5px;color:var(--mut)\">ORIGIN<\u002Fspan><b style=\"display:block;margin-top:4px;font-family:var(--mono);font-size:12px\">PROTOCOL<\u002Fb><\u002Fdiv><div style=\"padding:10px;background:var(--s2);border-radius:12px\"><span style=\"display:block;font-size:10.5px;color:var(--mut)\">READING<\u002Fspan><b style=\"display:block;margin-top:4px;font-family:var(--mono);font-size:12px\">ESSENTIAL<\u002Fb><\u002Fdiv><div style=\"padding:10px;background:var(--s2);border-radius:12px\"><span style=\"display:block;font-size:10.5px;color:var(--mut)\">CONTEXT<\u002Fspan><b style=\"display:block;margin-top:4px;font-family:var(--mono);font-size:12px\">IDENTIFIED<\u002Fb><\u002Fdiv><\u002Fdiv>\n      <\u002Farticle>\n      <article style=\"padding:22px;border-radius:22px;background:rgba(21,24,22,.92);border:1px solid var(--line);transition:.2s ease\" style-hover=\"border-color:color-mix(in srgb,var(--acc) 40%,var(--line));transform:translateX(4px)\">\n        <div class=\"trv-flex-wrap\" style=\"display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap\">\n          <span style=\"color:var(--mut);font-family:var(--mono);font-size:11px;font-weight:700\">CREATOR · COMMONS<\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;min-height:30px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;color:var(--mut);font-family:var(--mono);font-size:10.5px;font-weight:700\">VERSIONS<\u002Fspan>\n        <\u002Fdiv>\n        <h3 style=\"margin:13px 0 7px;font-size:1.16rem;line-height:1.25\">Community strategies<\u002Fh3>\n        <p style=\"color:#c3cbc5;font-size:14.5px\">Authors describe parameters and publish versions for analysis. The card carries evidence — hash, route, verdict — never a promise.<\u002Fp>\n        <div class=\"trv-grid trv-auto-grid trv-auto-96\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:7px;margin-top:18px\"><div style=\"padding:10px;background:var(--s2);border-radius:12px\"><span style=\"display:block;font-size:10.5px;color:var(--mut)\">AUTHOR<\u002Fspan><b style=\"display:block;margin-top:4px;font-family:var(--mono);font-size:12px\">IDENTIFIED<\u002Fb><\u002Fdiv><div style=\"padding:10px;background:var(--s2);border-radius:12px\"><span style=\"display:block;font-size:10.5px;color:var(--mut)\">SOCIAL ACT<\u002Fspan><b style=\"display:block;margin-top:4px;font-family:var(--mono);font-size:12px\">FOLLOW<\u002Fb><\u002Fdiv><div style=\"padding:10px;background:var(--s2);border-radius:12px\"><span style=\"display:block;font-size:10.5px;color:var(--mut)\">EXECUTION<\u002Fspan><b style=\"display:block;margin-top:4px;font-family:var(--mono);font-size:12px\">SEPARATE<\u002Fb><\u002Fdiv><\u002Fdiv>\n      <\u002Farticle>\n      <article style=\"padding:22px;border-radius:22px;background:rgba(21,24,22,.92);border:1px solid var(--line);transition:.2s ease\" style-hover=\"border-color:color-mix(in srgb,var(--acc) 40%,var(--line));transform:translateX(4px)\">\n        <div class=\"trv-flex-wrap\" style=\"display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap\">\n          <span style=\"color:var(--mut);font-family:var(--mono);font-size:11px;font-weight:700\">MY VAULT · PRIVATE<\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;min-height:30px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;color:var(--mut);font-family:var(--mono);font-size:10.5px;font-weight:700\">CONTROL<\u002Fspan>\n        <\u002Fdiv>\n        <h3 style=\"margin:13px 0 7px;font-size:1.16rem;line-height:1.25\">Personal configuration<\u002Fh3>\n        <p style=\"color:#c3cbc5;font-size:14.5px\">Professional mode gathers parameters and diagnostics for a deeper read, without changing a single permission.<\u002Fp>\n        <div class=\"trv-grid trv-auto-grid trv-auto-96\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:7px;margin-top:18px\"><div style=\"padding:10px;background:var(--s2);border-radius:12px\"><span style=\"display:block;font-size:10.5px;color:var(--mut)\">SCOPE<\u002Fspan><b style=\"display:block;margin-top:4px;font-family:var(--mono);font-size:12px\">OWNER ONLY<\u002Fb><\u002Fdiv><div style=\"padding:10px;background:var(--s2);border-radius:12px\"><span style=\"display:block;font-size:10.5px;color:var(--mut)\">DEPTH<\u002Fspan><b style=\"display:block;margin-top:4px;font-family:var(--mono);font-size:12px\">PRO<\u002Fb><\u002Fdiv><div style=\"padding:10px;background:var(--s2);border-radius:12px\"><span style=\"display:block;font-size:10.5px;color:var(--mut)\">PERMISSIONS<\u002Fspan><b style=\"display:block;margin-top:4px;font-family:var(--mono);font-size:12px\">UNCHANGED<\u002Fb><\u002Fdiv><\u002Fdiv>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"trv-grid trv-auto-grid trv-auto-300\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-top:18px\">\n    <article style=\"padding:28px;border-radius:28px;background:rgba(21,24,22,.92);border:1px solid color-mix(in srgb,var(--acc) 26%,var(--line))\">\n      <span style=\"display:block;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)\">Build · publish · earn<\u002Fspan>\n      <h3 style=\"margin:14px 0 12px;font-size:clamp(1.5rem,2.6vw,2.2rem);line-height:1.05;letter-spacing:-.04em\">Write a strategy. Let the network use it.<\u002Fh3>\n      <p style=\"color:#c3cbc5;font-size:15px\">Compose a mandate in the builder — network, assets, cooldown, allocation, slippage, gas, minimum profit — publish it to the Commons, and every vault that adopts it pays you a share of its own half. You never touch anyone's funds to earn.<\u002Fp>\n      <div class=\"trv-grid\" style=\"display:grid;gap:9px;margin-top:22px\">\n        <sc-for list=\"{{ authorSteps }}\" as=\"st\" hint-placeholder-count=\"4\">\n          <div class=\"trv-grid trv-row-grid\" style=\"display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;padding:12px 13px;border-radius:14px;background:var(--s2);border:1px solid var(--line)\">\n            <i class=\"trv-grid\" style=\"width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 14%,var(--s1));color:var(--acc);font-family:var(--mono);font-style:normal;font-size:11px;font-weight:800\">{{ st.n }}<\u002Fi>\n            <span style=\"min-width:0\"><b style=\"display:block;font-size:14px\">{{ st.title }}<\u002Fb><span style=\"display:block;color:#c3cbc5;font-size:13px;line-height:1.5;margin-top:4px\">{{ st.copy }}<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Farticle>\n    <article style=\"padding:28px;border-radius:28px;background:radial-gradient(circle at 88% 6%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 40%),rgba(21,24,22,.92);border:1px solid var(--line)\">\n      <div class=\"trv-flex-wrap\" style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap\">\n        <span style=\"font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)\">Where the author's cut comes from<\u002Fspan>\n        <span style=\"font-family:var(--mono);font-size:10px;font-weight:700;padding:5px 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--acc) 40%,var(--line));color:var(--acc)\">per micro-operation<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"margin-top:22px;display:flex;height:56px;border-radius:14px;overflow:hidden;border:1px solid var(--line)\">\n        <div class=\"trv-grid\" style=\"width:50%;display:grid;place-items:center;background:var(--s2);font-family:var(--mono);font-size:12px;font-weight:800;color:#c3cbc5\">PROTOCOL 50%<\u002Fdiv>\n        <div style=\"width:50%;display:flex\">\n          <div class=\"trv-grid\" style=\"width:66%;display:grid;place-items:center;background:var(--acc);color:var(--ink);font-family:var(--mono);font-size:12px;font-weight:800\">VAULT<\u002Fdiv>\n          <div class=\"trv-grid\" style=\"width:34%;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 45%,#0b0d02);color:#f5f7f3;font-family:var(--mono);font-size:11px;font-weight:800\">AUTHOR<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin-top:16px;color:#c3cbc5;font-size:14.5px\">The protocol's half is untouchable. The author's share is carved out of <b style=\"color:#f5f7f3\">the user's half only<\u002Fb>, at a rate the user sees before adopting — and it only ever applies to a positive eligible result. A losing operation pays nobody.<\u002Fp>\n      <div class=\"trv-grid trv-auto-grid trv-auto-120\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:20px\">\n        <sc-for list=\"{{ authorEcon }}\" as=\"e\" hint-placeholder-count=\"4\">\n          <div style=\"padding:12px;border-radius:13px;background:var(--s2);border:1px solid var(--line)\">\n            <span style=\"display:block;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.1em;color:var(--mut);text-transform:uppercase\">{{ e.k }}<\u002Fspan>\n            <b style=\"display:block;margin-top:5px;font-family:var(--mono);font-size:14px;color:{{ e.color }}\">{{ e.v }}<\u002Fb>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"margin-top:16px;color:var(--mut);font-family:var(--mono);font-size:10.5px;line-height:1.6\">Publishing grants nobody access to a vault. The strategy proposes; the mandate decides.<\u002Fp>\n    <\u002Farticle>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"trv-section trv-contained\" id=\"journey\" data-tone=\"40\" style=\"width:min(1240px,calc(100% - 40px));margin:auto;padding:110px 0\">\n  <div class=\"trv-grid trv-split-grid\" style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.48fr);gap:44px;align-items:end;margin-bottom:44px\">\n    <div>\n      <span style=\"font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--acc)\">04 · user journey<\u002Fspan>\n      <h2 style=\"margin:12px 0 0;font-size:clamp(2.1rem,4.4vw,4.5rem);line-height:1;letter-spacing:-.06em\">From discovery<br>to your own context.<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"color:#c3cbc5;font-size:15.5px\">A progressive entrance lowers friction: understand first, then experiment, configure and follow.<\u002Fp>\n  <\u002Fdiv>  <div class=\"trv-grid trv-auto-grid trv-auto-230\" style=\"position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px\">\n    <div style=\"position:absolute;left:8%;right:8%;top:35px;height:1px;background:linear-gradient(90deg,var(--acc),#53ead0,#85a7ff,var(--amber))\"><\u002Fdiv>\n    <article style=\"position:relative;padding:68px 20px 22px;border-radius:22px;background:rgba(21,24,22,.92);border:1px solid var(--line)\">\n      <i class=\"trv-grid\" style=\"position:absolute;z-index:1;top:17px;left:20px;width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:#080909;border:1px solid var(--acc);color:var(--acc);font-family:var(--mono);font-style:normal;font-size:11px;font-weight:700\">01<\u002Fi>\n      <h3 style=\"font-size:1.14rem;line-height:1.25\">Understand<\u002Fh3>\n      <p style=\"margin-top:8px;color:#c3cbc5;font-size:14px\">Read the proposal, the vocabulary, the six rooms and the limits of the experience.<\u002Fp>\n    <\u002Farticle>\n    <article style=\"position:relative;padding:68px 20px 22px;border-radius:22px;background:rgba(21,24,22,.92);border:1px solid var(--line)\">\n      <i class=\"trv-grid\" style=\"position:absolute;z-index:1;top:17px;left:20px;width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:#080909;border:1px solid var(--acc);color:var(--acc);font-family:var(--mono);font-style:normal;font-size:11px;font-weight:700\">02<\u002Fi>\n      <h3 style=\"font-size:1.14rem;line-height:1.25\">Experiment<\u002Fh3>\n      <p style=\"margin-top:8px;color:#c3cbc5;font-size:14px\">Use Labs and the demo to watch states, motion and personalisation without any risk.<\u002Fp>\n    <\u002Farticle>\n    <article style=\"position:relative;padding:68px 20px 22px;border-radius:22px;background:rgba(21,24,22,.92);border:1px solid var(--line)\">\n      <i class=\"trv-grid\" style=\"position:absolute;z-index:1;top:17px;left:20px;width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:#080909;border:1px solid var(--acc);color:var(--acc);font-family:var(--mono);font-style:normal;font-size:11px;font-weight:700\">03<\u002Fi>\n      <h3 style=\"font-size:1.14rem;line-height:1.25\">Configure<\u002Fh3>\n      <p style=\"margin-top:8px;color:#c3cbc5;font-size:14px\">Explore strategies and parameters in the Console without mistaking a simulation for an operation.<\u002Fp>\n    <\u002Farticle>\n    <article style=\"position:relative;padding:68px 20px 22px;border-radius:22px;background:rgba(21,24,22,.92);border:1px solid var(--line)\">\n      <i class=\"trv-grid\" style=\"position:absolute;z-index:1;top:17px;left:20px;width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:#080909;border:1px solid var(--acc);color:var(--acc);font-family:var(--mono);font-style:normal;font-size:11px;font-weight:700\">04<\u002Fi>\n      <h3 style=\"font-size:1.14rem;line-height:1.25\">Follow<\u002Fh3>\n      <p style=\"margin-top:8px;color:#c3cbc5;font-size:14px\">Organise your view: authors followed, strategies observed, history available.<\u002Fp>\n    <\u002Farticle>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"trv-section trv-contained\" id=\"preview\" data-tone=\"74\" style=\"width:min(1240px,calc(100% - 40px));margin:auto;padding:110px 0\">\n  <div class=\"trv-grid trv-split-grid\" style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.48fr);gap:44px;align-items:end;margin-bottom:44px\">\n    <div>\n      <span style=\"font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--acc)\">05 · the console, V5.4<\u002Fspan>\n      <h2 style=\"margin:12px 0 0;font-size:clamp(2.1rem,4.4vw,4.5rem);line-height:1;letter-spacing:-.06em\">Three environments.<br>One honest surface.<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"color:#c3cbc5;font-size:15.5px\">The console never blurs a simulation into an operation. The environment is always on screen, the protocol state is always named, and every number says where it came from.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"trv-flex-wrap\" style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px\">\n    <sc-for list=\"{{ envTabs }}\" as=\"env\" hint-placeholder-count=\"3\">\n      <button sc-camel-on-click=\"{{ env.select }}\" style=\"min-height:46px;display:inline-flex;align-items:center;gap:9px;padding:11px 18px;border-radius:14px;border:1px solid {{ env.border }};background:{{ env.bg }};color:{{ env.fg }};font-size:13px;font-weight:800\">\n        <i style=\"width:8px;height:8px;border-radius:50%;background:{{ env.dot }}\"><\u002Fi>{{ env.name }}\n      <\u002Fbutton>\n    <\u002Fsc-for>\n    <span style=\"display:inline-flex;align-items:center;gap:9px;min-height:46px;padding:11px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(21,24,22,.92);color:#c3cbc5;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em\">{{ env.summary }}<\u002Fspan>\n  <\u002Fdiv>\n\n  <div class=\"trv-grid trv-auto-grid trv-auto-300\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;align-items:start\">\n    <div class=\"trv-grid\" style=\"display:grid;place-items:center;padding:10px 0\">\n      <div class=\"trv-phone-preview\" style=\"width:min(272px,66vw);aspect-ratio:1/2.03;border-radius:38px;background:#000;border:1px solid #2c2c2c;box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 70px color-mix(in srgb,var(--acc) 14%,transparent);overflow:hidden;position:relative;animation:floaty 5s ease-in-out infinite\">\n        <div style=\"position:absolute;inset:0;background:#0b0b0b;display:flex;flex-direction:column;font-size:11px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;padding:13px 15px 8px\">\n            <span style=\"display:flex;align-items:center;gap:8px;font-weight:800;font-size:10.5px;letter-spacing:.12em\">\n              <svg sc-camel-view-box=\"0 0 320 296\" style=\"width:22px;height:22px;color:var(--acc)\" aria-hidden=\"true\"><path d=\"M75 168 L160 20 L245 168 L104 168\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"16\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n              TRIVIU\n            <\u002Fspan>\n            <span style=\"font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.1em;padding:3px 8px;border-radius:999px;border:1px solid {{ env.border }};color:{{ env.fg2 }}\">{{ env.badge }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:0 12px 8px;display:flex;gap:5px\">\n            <sc-for list=\"{{ modeTabs }}\" as=\"m\" hint-placeholder-count=\"2\">\n              <button sc-camel-on-click=\"{{ m.select }}\" style=\"flex:1;min-height:32px;padding:7px;border-radius:10px;background:{{ m.bg }};color:{{ m.fg }};font-size:9.5px;font-weight:800\">{{ m.name }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"margin:0 12px 8px;padding:9px 11px;border-radius:12px;background:var(--s1);border:1px solid var(--line);display:flex;align-items:center;gap:9px\">\n            <i style=\"width:8px;height:8px;border-radius:50%;background:{{ state.color }};flex:none;box-shadow:0 0 7px {{ state.color }}\"><\u002Fi>\n            <span style=\"min-width:0\"><b style=\"display:block;font-size:9.5px\">{{ state.title }}<\u002Fb><span style=\"display:block;color:var(--mut);font-size:8.5px;line-height:1.35;margin-top:2px\">{{ state.copy }}<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1;padding:0 12px 12px;display:flex;flex-direction:column;gap:8px;overflow:hidden\">\n            <div style=\"padding:13px;border-radius:15px;background:radial-gradient(circle at 88% 8%,color-mix(in srgb,{{ chainColor }} 30%,transparent),transparent 40%),linear-gradient(145deg,#1b1b1b,#080808 68%);border:1px solid color-mix(in srgb,{{ chainColor }} 34%,var(--line))\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px\">\n                <span style=\"display:flex;align-items:center;gap:7px\"><i class=\"trv-grid\" style=\"width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,{{ chainColor }} 20%,var(--s2));border:1px solid color-mix(in srgb,{{ chainColor }} 52%,var(--line));font-family:var(--mono);font-size:8px;font-weight:800;font-style:normal\">{{ net.code }}<\u002Fi>\n                <span><span style=\"display:block;color:var(--mut);font-family:var(--mono);font-size:7.5px;letter-spacing:.1em\">CONSOLIDATED VAULT<\u002Fspan><b style=\"display:block;font-size:9.5px\">{{ net.name }}<\u002Fb><\u002Fspan><\u002Fspan>\n                <span style=\"font-family:var(--mono);font-size:8px;font-weight:700;padding:3px 7px;border-radius:999px;border:1px solid color-mix(in srgb,var(--acc) 38%,var(--line));color:var(--acc)\">ESTIMATED<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-family:var(--mono);font-size:26px;font-weight:800;letter-spacing:-.05em;margin-top:14px\">{{ phoneValue }}<\u002Fdiv>\n              <span style=\"display:block;color:var(--mut);font-size:8.5px;margin-top:3px\">Synthetic balance · no asset connected<\u002Fspan>\n              <div style=\"display:flex;align-items:center;gap:6px;margin-top:9px;font-size:8.5px;color:var(--mut)\">Scenario result <b style=\"font-family:var(--mono);color:{{ deltaFg2 }}\">{{ phoneDelta }}<\u002Fb> · unrealised<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:11px;border-radius:14px;background:var(--s1);border:1px solid var(--line)\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px\"><b style=\"font-size:9.5px\">Micro-operation ledger<\u002Fb><span style=\"font-family:var(--mono);font-size:8px;color:var(--acc)\">50 / 50<\u002Fspan><\u002Fdiv>\n              <sc-for list=\"{{ ledger }}\" as=\"row\" hint-placeholder-count=\"3\">\n                <div class=\"trv-grid trv-row-grid\" style=\"display:grid;grid-template-columns:auto 1fr auto;gap:7px;align-items:center;padding:5px 0;border-top:1px solid var(--line);font-size:8.5px;animation:feedIn .35s ease\">\n                  <b style=\"font-family:var(--mono);color:var(--acc)\">{{ row.id }}<\u002Fb>\n                  <span style=\"color:#a9b0aa;font-family:var(--mono)\">{{ row.split }}<\u002Fspan>\n                  <b style=\"font-family:var(--mono)\">{{ row.vault }}<\u002Fb>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div class=\"trv-grid trv-two-grid\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:7px\">\n              <sc-for list=\"{{ quickActions }}\" as=\"q\" hint-placeholder-count=\"4\">\n                <div style=\"padding:9px;border-radius:12px;background:var(--s1);border:1px solid var(--line)\"><b style=\"display:block;font-size:9px\">{{ q.title }}<\u002Fb><span style=\"display:block;color:var(--mut);font-size:8px;margin-top:2px\">{{ q.sub }}<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin-top:14px;max-width:280px;text-align:center;color:var(--mut);font-family:var(--mono);font-size:10.5px;line-height:1.6;letter-spacing:.06em;text-transform:uppercase\">Essential hides depth, never warnings · Professional adds parameters, routes and diagnostics<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"trv-grid\" style=\"display:grid;gap:14px\">\n      <div style=\"border-radius:20px;border:1px solid #2c2c2c;background:#101010;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.55),0 0 70px color-mix(in srgb,var(--acc) 10%,transparent)\">\n        <div class=\"trv-flex-wrap\" style=\"display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap\">\n          <svg sc-camel-view-box=\"0 0 320 296\" style=\"width:22px;height:22px;color:var(--acc);flex:none\" aria-hidden=\"true\"><path d=\"M75 168 L160 20 L245 168 L104 168\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"16\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n          <span style=\"font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--mut)\">CONSOLE V5.4 · {{ modeLabel }}<\u002Fspan>\n          <span style=\"flex:1\"><\u002Fspan>\n          <span style=\"font-family:var(--mono);font-size:9.5px;font-weight:700;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--mut)\">{{ net.code }} · read-only<\u002Fspan>\n          <span style=\"font-family:var(--mono);font-size:9.5px;font-weight:700;padding:4px 9px;border-radius:999px;border:1px solid {{ env.border }};color:{{ env.fg2 }}\">{{ env.badge }}<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"trv-grid trv-auto-grid trv-auto-170\" style=\"padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px\">\n          <sc-for list=\"{{ deskCells }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <div style=\"background:var(--s1);border-radius:14px;padding:14px;border:1px solid var(--line)\">\n              <span style=\"display:block;color:var(--mut);font-weight:700;font-size:10px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase\">{{ c.label }}<\u002Fspan>\n              <div style=\"font-family:var(--mono);font-size:19px;font-weight:700;margin-top:6px;color:{{ c.color }};word-break:break-word\">{{ c.value }}<\u002Fdiv>\n              <span style=\"display:block;font-size:11px;color:var(--mut);margin-top:5px;line-height:1.45\">{{ c.note }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"padding:0 16px 16px\">\n          <div style=\"padding:14px;border-radius:15px;background:var(--s1);border:1px solid var(--line)\">\n            <div class=\"trv-flex-wrap\" style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px\">\n              <b style=\"font-size:13px\">Decision gates<\u002Fb>\n              <span style=\"font-family:var(--mono);font-size:10px;font-weight:700;padding:5px 10px;border-radius:999px;border:1px solid {{ gateBorder }};color:{{ gateColor }}\">{{ gateVerdict }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ gates }}\" as=\"g\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:12px;background:var(--s2);font-size:12px;margin-top:7px\">\n                <i class=\"trv-grid\" style=\"width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:800;flex:none;background:{{ g.bg }};color:{{ g.fg }}\">{{ g.icon }}<\u002Fi>\n                <span style=\"min-width:0;color:#c3cbc5\">{{ g.label }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <p style=\"margin-top:11px;color:var(--mut);font-family:var(--mono);font-size:10.5px;line-height:1.6\">PASS ⇔ vault credit ≥ minimum ∧ amountOut ≥ amountOutMin ∧ quoteAge ≤ maximum<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"trv-grid trv-auto-grid trv-auto-210\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px\">\n        <div style=\"padding:18px;border-radius:20px;background:rgba(21,24,22,.92);border:1px solid var(--line)\">\n          <span style=\"display:block;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)\">Accounting<\u002Fspan>\n          <p style=\"margin-top:10px;color:#c3cbc5;font-size:14px\">Every positive eligible result is split at the event: <b style=\"color:#f5f7f3\">50% protocol PayFee, 50% the user's economic share<\u002Fb>. A community author is paid out of the user's half — never out of the protocol's.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding:18px;border-radius:20px;background:rgba(21,24,22,.92);border:1px solid var(--line)\">\n          <span style=\"display:block;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)\">Custody<\u002Fspan>\n          <p style=\"margin-top:10px;color:#c3cbc5;font-size:14px\">Wallet → vault → mandate → strategy. The strategy only proposes, read-only; the mandate decides; the vault holds the limits. <b style=\"color:#f5f7f3\">The route is verified, not executed.<\u002Fb><\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding:18px;border-radius:20px;background:rgba(21,24,22,.92);border:1px solid var(--line)\">\n          <span style=\"display:block;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)\">Commons<\u002Fspan>\n          <p style=\"margin-top:10px;color:#c3cbc5;font-size:14px\">Publishing a strategy grants nobody access to anyone's vault. Cards carry evidence — hash, route, verdict — and following stays <b style=\"color:#f5f7f3\">a social act<\u002Fb>.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"trv-section trv-contained\" id=\"wallet\" data-tone=\"74\" style=\"width:min(1240px,calc(100% - 40px));margin:auto;padding:110px 0\">\n  <div class=\"trv-grid trv-split-grid\" style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.48fr);gap:44px;align-items:end;margin-bottom:44px\">\n    <div>\n      <span style=\"font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--acc)\">06 · the wallet<\u002Fspan>\n      <h2 style=\"margin:12px 0 0;font-size:clamp(2.1rem,4.4vw,4.5rem);line-height:1;letter-spacing:-.06em\">Your vault,<br>with a face.<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"color:#c3cbc5;font-size:15.5px\">A new user lands here first: one card, one address, one legible list of what the vault holds. Pick a finish — the card is the vault, not a bank product.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"trv-grid trv-auto-grid trv-auto-320\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;align-items:start\">\n    <div>\n      <div style=\"aspect-ratio:1.59;min-height:270px;border-radius:28px;padding:26px;position:relative;overflow:hidden;background:{{ cardBg }};border:1px solid {{ cardBorder }};box-shadow:0 28px 80px rgba(0,0,0,.45);display:flex;flex-direction:column\">\n        <div style=\"position:absolute;width:330px;height:330px;border-radius:50%;border:1px solid rgba(255,255,255,.1);right:-135px;top:-140px\"><\u002Fdiv>\n        <div style=\"position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:15px\">\n          <div>\n            <div style=\"font-size:12px;font-weight:800;letter-spacing:.14em;color:{{ cardInk }}\">TRIVIU {{ cardName }}<\u002Fdiv>\n            <div style=\"font-family:var(--mono);font-size:11px;color:{{ cardMut }};margin-top:5px\">Non-custodial vault · owner only<\u002Fdiv>\n          <\u002Fdiv>\n          <svg sc-camel-view-box=\"0 0 320 296\" style=\"width:52px;height:48px;color:{{ cardMark }};flex:none\" aria-hidden=\"true\">\n            <path d=\"M75 168 L160 20 L245 168 L104 168\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".26\" stroke-dasharray=\"2 11\"><\u002Fpath>\n            <path d=\"M75 168 L160 20 L245 168 L104 168\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-dasharray=\"68 390\" style=\"animation:route 5.2s linear infinite\"><\u002Fpath>\n            <circle cx=\"160\" cy=\"20\" r=\"9\" fill=\"currentColor\"><\u002Fcircle>\n            <circle cx=\"245\" cy=\"168\" r=\"9\" fill=\"currentColor\"><\u002Fcircle>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <div style=\"position:relative;width:48px;height:36px;border-radius:10px;background:linear-gradient(135deg,#777,#222 55%,#aaa);border:1px solid #777;margi
