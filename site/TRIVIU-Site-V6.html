    <circle cx=\"245\" cy=\"168\" r=\"9\" fill=\"currentColor\"><\u002Fcircle>\n          <\u002Fsvg>\n          TRIVIU\n        <\u002Fa>\n        <p style=\"margin-top:14px;font-size:14px\">Connected strategies.<br>Autonomy in motion.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <b style=\"display:block;color:#f5f7f3;font-size:13px;margin-bottom:12px;letter-spacing:.08em\">EXPLORE<\u002Fb>\n        <a href=\"#protocol\" style=\"display:block;margin:8px 0;color:var(--mut);font-size:13.5px\">Protocol<\u002Fa><a href=\"#commons\" style=\"display:block;margin:8px 0;color:var(--mut);font-size:13.5px\">Commons<\u002Fa><a href=\"#journey\" style=\"display:block;margin:8px 0;color:var(--mut);font-size:13.5px\">Journey<\u002Fa>\n      <\u002Fdiv>\n      <div>\n        <b style=\"display:block;color:#f5f7f3;font-size:13px;margin-bottom:12px;letter-spacing:.08em\">SURFACES<\u002Fb>\n        <a href=\"#preview\" style=\"display:block;margin:8px 0;color:var(--mut);font-size:13.5px\">Console<\u002Fa><a href=\"#surfaces\" style=\"display:block;margin:8px 0;color:var(--mut);font-size:13.5px\">Labs<\u002Fa><a href=\"#name\" style=\"display:block;margin:8px 0;color:var(--mut);font-size:13.5px\">Brand<\u002Fa>\n      <\u002Fdiv>\n      <div>\n        <b style=\"display:block;color:#f5f7f3;font-size:13px;margin-bottom:12px;letter-spacing:.08em\">CONTEXT<\u002Fb>\n        <a href=\"#transparency\" style=\"display:block;margin:8px 0;color:var(--mut);font-size:13.5px\">Transparency<\u002Fa><a href=\"#roadmap\" style=\"display:block;margin:8px 0;color:var(--mut);font-size:13.5px\">Roadmap<\u002Fa><a href=\"#top\" style=\"display:block;margin:8px 0;color:var(--mut);font-size:13.5px\">Back to top<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"trv-flex-wrap\" style=\"display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:40px;padding-top:20px;border-top:1px solid var(--line);font-size:12px\">\n      <span>© 2026 TRIVIU · institutional build<\u002Fspan>\n      <span>Illustrative figures · no financial execution<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900}}\">\nconst NETS=[\n  {key:'polygon',name:'Polygon',code:'POL',color:'#8247e5',chainId:137,base:64821904,sub:'illustrative context',\n   contracts:[['ProtocolRegistry','0x7D1D…d8dC'],['VaultFactory','0xF4e6…843c'],['Executor','0x323C…3E835'],['EscapeHatch','0x877c…3b490']]},\n  {key:'arbitrum',name:'Arbitrum',code:'ARB',color:'#28a0f0',chainId:42161,base:281043117,sub:'illustrative context',contracts:[]},\n  {key:'bsc',name:'BNB Smart Chain',code:'BNB',color:'#f3ba2f',chainId:56,base:44120887,sub:'illustrative context',contracts:[]}\n];\n\nconst LAYERS=[\n {id:'vault',n:'01',name:'Vault',kicker:'01 · VAULT',title:'Your context starts here.',\n  copy:'One personal vault per user, cloned by the factory from a published implementation. The owner is set at creation and never changes; deposits and withdrawals stay explicit acts of the owner.',\n  stats:[['STRUCTURE','ERC-1967 PROXY','stated'],['ADDRESS','DETERMINISTIC · CREATE2','spec'],['WITHDRAWAL','OWNER FLOW','stated'],['VERIFICATION','CONTRACTS PENDING','pending']],\n  note:'Structure described in the reference material. Source verification and audit reporting are still pending.'},\n {id:'mandate',n:'02',name:'Mandate',kicker:'02 · MANDATE',title:'Limits written before the action.',\n  copy:'The mandate is born closed: empty asset list, ceilings at zero, minimum return at zero. Nothing opens until the owner arms it, and every rejection carries a reason. Each edit produces a new identifiable version so no order leans on stale configuration.',\n  stats:[['BORN','CLOSED','stated'],['GUARDS','UP TO 8 IN THE MODEL','spec'],['VERSION','CONFIG EPOCH','spec'],['REJECTIONS','CARRY A NAMED REASON','stated']],\n  note:'The fence belongs to the vault owner. Neither the operator nor governance can move it.'},\n {id:'execution',n:'03',name:'Execution',kicker:'03 · EXECUTION',title:'Strategy proposes. Rules decide.',\n  copy:'Execution is stateless and atomic: the route runs in a single transaction or reverts whole, leaving only gas spent. The contract enforces one condition — final balance must clear the initial balance plus the minimum profit.',\n  stats:[['ADVICE','READ-ONLY','stated'],['LIMITS','CHECKED BEFORE ROUTING','stated'],['GUARDS','VETO ONLY','stated'],['GATES','CLOSED BY DESIGN','stated']],\n  note:'The interface must show each state without implying execution when only a simulation ran.'},\n {id:'market',n:'04',name:'Market',kicker:'04 · MARKET',title:'Positions with context, not just numbers.',\n  copy:'Every buy becomes a lot carrying its allocated cost and its sale policy. A secondary market may only act after validating compatibility, price, balance, mandate and settlement.',\n  stats:[['UNIT','LOT','spec'],['BASIS','ALLOCATED COST','spec'],['POLICY','MINIMUM RETURN','spec'],['BUY','PRE-VALIDATED','stated']],\n  note:'Profit is measured against allocated cost, never against sentiment.'},\n {id:'referral',n:'05',name:'Referral',kicker:'05 · REFERRAL',title:'Distribution described by rule.',\n  copy:'The referral layer organises nodes, levels and settlement. The percentages below come from the reference model; a strategy author, when one exists, is paid out of the user half — never out of the protocol half.',\n  stats:[['LEVEL 1','25% IN THE MODEL','spec'],['LEVEL 2','15% IN THE MODEL','spec'],['LEVEL 3','10% IN THE MODEL','spec'],['CONTRACT','NOT PUBLISHED','pending']],\n  note:'Rates and eligibility only hold once read from a published contract.'},\n {id:'failsafe',n:'06',name:'Exit',kicker:'06 · EXIT MECHANISM',title:'One door, always open.',\n  copy:'The escape hatch is immutable inside the vault: withdrawal consults neither the engine, nor the fence, nor the operator, nor governance. If every other layer stops, this path keeps answering.',\n  stats:[['IN THE VAULT','IMMUTABLE','stated'],['DEPENDENCIES','NONE','stated'],['PAUSE FLAG','NOT READ','stated'],['EVIDENCE','SOURCE + FORK PENDING','pending']],\n  note:'Unconditional withdrawal is the foundation of the non-custodial model — and the reason trusting us is never required.'}\n];\nconst TAGC={stated:'var(--acc)',pending:'var(--amber)',spec:'var(--red)'};\nconst TAGL={stated:'stated',pending:'pending',spec:'spec'};\nconst mapStats=s=>s.map(([label,value,tag])=>({label,value,tag:TAGL[tag],color:TAGC[tag]}));\n\nconst FEED=[['ETH moved up','+0.42%',1],['Fee accrued','+$0.84',1],['Filled · operator bought ETH','-$96.40',0],['WBTC moved down','-0.18%',0],['SOL moved up','+0.61%',1],['Guard vetoed a route','no fill',0]];\n\n/* console V5.4 · environments, states and the 50/50 micro-operation split */\nconst ENVS=[\n {key:'demo',name:'Demo',badge:'DEMO',color:'var(--acc)',\n  summary:'always available · synthetic data, no wallet, no capital'},\n {key:'testnet',name:'Testnet',badge:'TESTNET',color:'#85a7ff',\n  summary:'test networks · contracts under homologation'},\n {key:'real',name:'Real capital',badge:'LOCKED',color:'var(--amber)',\n  summary:'locked · needs contracts, audit and eligibility controls'}\n];\nconst STATES={\n demo:{title:'Console ready',copy:'Demo vault synced with synthetic data.',color:'var(--acc)'},\n testnet:{title:'Awaiting a source',copy:'Testnet context; no signature is requested.',color:'#85a7ff'},\n real:{title:'Real capital locked',copy:'No path to execution in this build.',color:'var(--amber)'}\n};\nconst LEDGER=[\n {id:'#A91D',split:'$0.20 elig · $0.10 protocol',vault:'$0.10',strategy:'Default · Triangular'},\n {id:'#4FC2',split:'$0.20 elig · $0.05 author',vault:'$0.05',strategy:'Community · 50/50'},\n {id:'#77B8',split:'$0.60 elig · $0.30 protocol',vault:'$0.25',strategy:'Community · 16.67%'}\n];\nconst GATES=[\n {label:'Vault credit ≥ minimum profit',ok:false},\n {label:'amountOut ≥ amountOutMin',ok:true},\n {label:'quoteAge 4s ≤ maximum 12s',ok:true},\n {label:'Route verified — execution disabled by design',ok:true}\n];\nconst CARDS=[\n {key:'black',name:'BLACK',bg:'linear-gradient(145deg,#222 0%,#090909 48%,#171717 100%)',border:'#343434',ink:'#f5f7f3',mut:'#8d938e',mark:'var(--acc)'},\n {key:'graphite',name:'GRAPHITE',bg:'linear-gradient(145deg,#4a4a4a,#151515 45%,#262626)',border:'#5a5a5a',ink:'#f5f7f3',mut:'#a8aea9',mark:'var(--acc)'},\n {key:'accent',name:'ACCENT',bg:'linear-gradient(145deg,color-mix(in srgb,var(--acc) 74%,#111),#080808 72%)',border:'color-mix(in srgb,var(--acc) 45%,#333)',ink:'#f5f7f3',mut:'#b9c0ba',mark:'#f5f7f3'}\n];\nconst ASSETS=[\n {code:'USDC',name:'USD Coin',share:'42% · base currency',value:'$5,160.13',tint:'var(--acc)'},\n {code:'WETH',name:'Wrapped Ether',share:'29%',value:'$3,562.09',tint:'#85a7ff'},\n {code:'WBTC',name:'Wrapped Bitcoin',share:'19%',value:'$2,334.15',tint:'#bd91ff'},\n {code:'POL',name:'Polygon',share:'10%',value:'$1,228.04',tint:'#8247e5'}\n];\nconst AUTHOR_STEPS=[\n {n:'01',title:'Compose the mandate',copy:'Network, allowed assets, cooldown, allocation cap, slippage, gas and minimum profit — written before anything runs.'},\n {n:'02',title:'Publish to the Commons',copy:'Your card carries evidence: hash, route and verdict. Readers compare versions and follow the author.'},\n {n:'03',title:'Vaults adopt it',copy:'Each owner arms it inside their own fence. Adoption never hands you a key or a balance.'},\n {n:'04',title:'Earn on positive results',copy:'Your share is settled per micro-operation, out of the adopting user\\u2019s half, and only when the result is positive.'}\n];\nconst AUTHOR_ECON=[\n {k:'Protocol',v:'50%',color:'#c3cbc5'},\n {k:'User half',v:'50%',color:'var(--acc)'},\n {k:'Author range',v:'0–50%',color:'var(--acc)'},\n {k:'On a loss',v:'nobody paid',color:'var(--red)'}\n];\nconst WALLET_FACTS=[\n {k:'Custody',v:'OWNER ONLY',note:'Set at creation and never reassigned.',color:'var(--acc)'},\n {k:'Withdrawal',v:'UNCONDITIONAL',note:'Consults no engine, fence, operator or governance.',color:'var(--acc)'},\n {k:'Privacy',v:'ONE TAP',note:'Balances hide across every surface at once.',color:'#f5f7f3'},\n {k:'Signature',v:'NEVER HERE',note:'This page reads; the console asks only when you act.',color:'#f5f7f3'}\n];\nconst QUICK=[\n {title:'Commons',sub:'Feed and authors'},\n {title:'Strategies',sub:'Mandates and guards'},\n {title:'Referral',sub:'Node and invites'},\n {title:'Wallet',sub:'Assets and contracts'}\n];\n\nclass Component extends DCLogic {\n  state={hue:74,layer:0,net:0,diveIx:-1,env:0,mode:0,cardIx:0,value:12763.73,delta:0,series:Array.from({length:22},(_,i)=>12500+Math.sin(i/2.6)*260+Math.random()*140),\n    feed:[{label:FEED[0][0],value:FEED[0][1],color:'var(--acc)'},{label:FEED[1][0],value:FEED[1][1],color:'var(--acc)'}],\n    clock:'9:41',wallets:4128,capital:2841773,vaults:1136,cycles:58214,block:null,blocks:[]};\n\n  componentDidMount(){\n    this.reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;\n    this.root=document.documentElement;\n    this.paint(74);\n    this.tick();\n    this.startChainField();\n    this.bindPointer();\n    this.bindKeys();\n    this.bindTone();\n    const d=new Date();\n    this.setState({clock:d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')});\n  }\n  componentWillUnmount(){\n    clearInterval(this.timer);clearInterval(this.blockTimer);\n    cancelAnimationFrame(this.rafField);cancelAnimationFrame(this.rafHero);\n    removeEventListener('pointermove',this.onMove);removeEventListener('keydown',this.onKey);removeEventListener('scroll',this.onScroll);\n  }\n\n  /* ── colour engine: hue follows the pointer while you navigate ── */\n  paint(hue){\n    const h=((hue%360)+360)%360;\n    const f=n=>{const k=(n+h/30)%12,a=.9*Math.min(.62,1-.62);return Math.round(255*(.62-a*Math.max(-1,Math.min(k-3,Math.min(9-k,1)))))};\n    const rgb=[f(0),f(8),f(4)];\n    const lum=rgb.map(v=>{const s=v/255;return s<=.03928?s/12.92:Math.pow((s+.055)/1.055,2.4)}).reduce((a,v,i)=>a+v*[.2126,.7152,.0722][i],0);\n    this.root.style.setProperty('--acc',`rgb(${rgb[0]},${rgb[1]},${rgb[2]})`);\n    this.root.style.setProperty('--ink',lum>.19?'#0b0d02':'#ffffff');\n    this.rgbText=`rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`;\n    this.hue=h;\n  }\n  bindPointer(){\n    this.onMove=e=>{\n      const g=document.querySelector('[data-glow]');\n      if(g){g.style.left=e.clientX+'px';g.style.top=e.clientY+'px';}\n      this.mx=e.clientX;this.my=e.clientY;\n      if(this.reduce)return;\n      /* horizontal travel steers hue, vertical travel bends it — the user drives the RGB */\n      const h=(e.clientX/innerWidth)*300+(e.clientY/innerHeight)*60+this.toneBase;\n      this.paint(h);\n      if(!this.hueRaf)this.hueRaf=requestAnimationFrame(()=>{this.hueRaf=null;this.forceUpdate();});\n    };\n    addEventListener('pointermove',this.onMove,{passive:true});\n  }\n  bindTone(){\n    this.toneBase=0;\n    this.onScroll=()=>{\n      if(this.scrollRaf)return;\n      this.scrollRaf=requestAnimationFrame(()=>{\n        this.scrollRaf=null;\n        const secs=[...document.querySelectorAll('section[data-tone]')];\n        const y=scrollY+innerHeight*.45;let tone=74;\n        secs.forEach(s=>{const r=s.getBoundingClientRect();const top=r.top+scrollY;if(y>=top)tone=+s.dataset.tone;});\n        this.toneBase=tone-150;\n        if(!this.mx)this.paint(tone);\n      });\n    };\n    addEventListener('scroll',this.onScroll,{passive:true});\n    this.onScroll();\n  }\n  bindKeys(){\n    this.onKey=e=>{\n      if(this.state.diveIx<0)return;\n      if(e.key==='Escape')this.setState({diveIx:-1});\n      if(e.key==='ArrowLeft')this.shiftDive(-1);\n      if(e.key==='ArrowRight')this.shiftDive(1);\n    };\n    addEventListener('keydown',this.onKey);\n  }\n  shiftDive(d){this.setState(s=>({diveIx:(s.diveIx+d+LAYERS.length)%LAYERS.length}));}\n\n  /* ── synthetic tickers: previews + protocol counters ── */\n  tick(){\n    if(this.reduce)return;\n    this.timer=setInterval(()=>{\n      if(document.hidden)return;\n      this.setState(s=>{\n        const d=(Math.random()-.46)*.62;\n        const value=s.value*(1+d/100);\n        const series=[...s.series.slice(1),value];\n        const feed=Math.random()<.5?[{...(()=>{const e=FEED[Math.random()*FEED.length|0];return {label:e[0],value:e[1],color:e[2]?'var(--acc)':'#ffffff'}})()},...s.feed].slice(0,3):s.feed;\n        return {value,delta:d,series,feed,\n          wallets:s.wallets+(Math.random()<.35?1:0),\n          capital:s.capital+Math.round((Math.random()-.35)*4200),\n          vaults:s.vaults+(Math.random()<.12?1:0),\n          cycles:s.cycles+(Math.random()<.6?1:0)};\n      });\n    },1500);\n    /* one new block per chain, in turn */\n    let i=0;\n    this.blockTimer=setInterval(()=>{\n      if(document.hidden)return;\n      const n=NETS[i%NETS.length];i++;\n      const height=n.base+Math.floor((Date.now()-1767225600000)/2200)%900000;\n      this.setState({block:{chain:n.name,code:n.code,color:n.color,height}});\n    },2600);\n  }\n\n  /* ── the background IS the chain: blocks mint and drift, chain by chain ── */\n  startChainField(){\n    const cv=document.querySelector('[data-chain]');\n    if(!cv||this.reduce)return;\n    const ctx=cv.getContext('2d');\n    const dpr=Math.min(2,devicePixelRatio||1);\n    const size=()=>{cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);};\n    size();addEventListener('resize',size);\n    /* galaxy: three parallax star layers, drifting slowly */\n    const stars=[];\n    const seedStars=()=>{stars.length=0;\n      const n=Math.min(420,Math.round(innerWidth*innerHeight/3600));\n      for(let i=0;i<n;i++){const d=Math.random();\n        stars.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,\n          r:d<.7?.6+Math.random()*.7:1.1+Math.random()*1.1,\n          a:.12+Math.random()*.5,tw:Math.random()*6.28,\n          vx:(.02+d*.14)*(Math.random()<.5?-1:1),vy:(.01+d*.06)});}};\n    seedStars();addEventListener('resize',seedStars);\n    const blocks=[];let last=0,turn=0,seq=NETS.map(n=>n.base);\n    const mk=now=>{\n      const n=NETS[turn%NETS.length];seq[turn%NETS.length]++;\n      const lane=(turn%NETS.length);turn++;\n      blocks.push({t:now,x:-90,y:innerHeight*(.18+lane*.3)+(Math.random()-.5)*70,\n        w:58+Math.random()*26,h:34+Math.random()*14,net:n,height:seq[lane],\n        v:.32+Math.random()*.2,tilt:(Math.random()-.5)*.12,depth:.55+Math.random()*.45});\n      if(blocks.length>26)blocks.shift();\n    };\n    const frame=now=>{\n      this.rafField=requestAnimationFrame(frame);\n      if(document.hidden)return;\n      if(now-last>1150){mk(now);last=now;}\n      const W=innerWidth,H=innerHeight;\n      ctx.clearRect(0,0,W,H);\n      const px=((this.mx||W/2)/W-.5),py=((this.my||H/2)/H-.5);\n      stars.forEach(s=>{\n        s.x+=s.vx;s.y+=s.vy;s.tw+=.02;\n        if(s.x<-4)s.x=W+4;if(s.x>W+4)s.x=-4;if(s.y>H+4)s.y=-4;\n        const dx=s.x-px*s.r*26,dy=s.y-py*s.r*18;\n        ctx.globalAlpha=s.a*(.72+Math.sin(s.tw)*.28);\n        ctx.fillStyle='#f5f7f3';\n        ctx.beginPath();ctx.arc(dx,dy,s.r,0,7);ctx.fill();\n      });\n      ctx.globalAlpha=1;\n      ctx.lineWidth=1.2;ctx.font='600 10px \"Space Mono\", monospace';\n      let prev=null;\n      blocks.forEach(b=>{\n        b.x+=b.v*b.depth*1.9;\n        if(b.x>W+120)b.x=-120;\n        const a=.10+b.depth*.16;\n        ctx.save();\n        ctx.translate(b.x,b.y);ctx.rotate(b.tilt);\n        ctx.globalAlpha=a;\n        ctx.strokeStyle=b.net.color;ctx.fillStyle=b.net.color;\n        ctx.beginPath();ctx.roundRect(-b.w/2,-b.h/2,b.w,b.h,7);ctx.stroke();\n        ctx.globalAlpha=a*.16;ctx.fill();\n        ctx.globalAlpha=a*2.1;\n        ctx.fillText(b.net.code,-b.w/2+7,-b.h/2+14);\n        ctx.globalAlpha=a*1.5;\n        ctx.fillStyle='#f5f7f3';\n        ctx.fillText('#'+String(b.height).slice(-6),-b.w/2+7,b.h/2-7);\n        ctx.restore();\n        if(prev&&prev.net.key===b.net.key){\n          ctx.globalAlpha=.07;ctx.strokeStyle=b.net.color;\n          ctx.beginPath();ctx.moveTo(prev.x+prev.w/2,prev.y);ctx.lineTo(b.x-b.w/2,b.y);ctx.stroke();\n        }\n        prev=b;\n      });\n      ctx.globalAlpha=1;\n    };\n    this.rafField=requestAnimationFrame(frame);\n  }\n\n  /* ── hero: the open triangle, drawn in perspective ── */\n  startHero(){\n    const cv=document.querySelector('[data-hero3d]');\n    if(!cv||this.reduce)return;\n    const ctx=cv.getContext('2d');\n    const dpr=Math.min(2,devicePixelRatio||1);\n    const A=[-1.7,-1.35,0],B=[0,1.55,0],C=[1.7,-1.35,0],D=[-1.05,-1.35,0];\n    const pts=[A,B,C,D];\n    const cat=t=>{const n=pts.length-1,seg=Math.min(Math.floor(t*n),n-1),u=t*n-seg;\n      const p0=pts[Math.max(seg-1,0)],p1=pts[seg],p2=pts[seg+1],p3=pts[Math.min(seg+2,n)];\n      return [0,1,2].map(i=>.5*(2*p1[i]+(-p0[i]+p2[i])*u+(2*p0[i]-5*p1[i]+4*p2[i]-p3[i])*u*u+(-p0[i]+3*p1[i]-3*p2[i]+p3[i])*u*u*u));};\n    const path=[];for(let i=0;i<=150;i++)path.push(cat(i/150));\n    const proj=(p,rx,ry,w,h)=>{const cy=Math.cos(ry),sy=Math.sin(ry);const x1=p[0]*cy+p[2]*sy,z1=-p[0]*sy+p[2]*cy;\n      const cx=Math.cos(rx),sx=Math.sin(rx);const y1=p[1]*cx-z1*sx,z2=p[1]*sx+z1*cx;const f=6/(6+z2);\n      return {x:w/2+x1*f*Math.min(w,h)*.19,y:h/2-y1*f*Math.min(w,h)*.19,f};};\n    let prog=0,rot={x:.12,y:0};\n    const frame=now=>{\n      this.rafHero=requestAnimationFrame(frame);\n      if(document.hidden)return;\n      const r=cv.getBoundingClientRect();\n      const w=Math.round(r.width*dpr),h=Math.round(r.height*dpr);\n      if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}\n      prog=(prog+.0038)%1;\n      const acc=getComputedStyle(this.root).getPropertyValue('--acc').trim()||'#cdfb2f';\n      rot.y+=(((this.mx||innerWidth/2)/innerWidth-.5)*1.1-rot.y)*.06;\n      const ry=rot.y+Math.sin(now/3800)*.5,rx=.12+(((this.my||innerHeight/2)/innerHeight-.5)*-.5);\n      ctx.clearRect(0,0,w,h);\n      const P=path.map(p=>proj(p,rx,ry,w,h));\n      ctx.lineCap='round';ctx.lineJoin='round';\n      ctx.beginPath();P.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));\n      ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=3*dpr;ctx.stroke();\n      const upto=Math.max(2,Math.floor(P.length*prog));\n      ctx.beginPath();for(let i=0;i<upto;i++){const p=P[i];i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y);}\n      ctx.shadowColor=acc;ctx.shadowBlur=18*dpr;ctx.strokeStyle=acc;ctx.lineWidth=4.5*dpr;ctx.stroke();\n      const hd=P[Math.min(upto-1,P.length-1)];\n      ctx.beginPath();ctx.arc(hd.x,hd.y,7*hd.f*dpr,0,7);ctx.fillStyle=acc;ctx.fill();ctx.shadowBlur=0;\n      [A,B,C].forEach(p=>{const n=proj(p,rx,ry,w,h);\n        ctx.beginPath();ctx.arc(n.x,n.y,9*n.f*dpr,0,7);ctx.fillStyle='#f5f7f3';ctx.fill();});\n      const o=proj(A,rx,ry,w,h);\n      ctx.beginPath();ctx.arc(o.x,o.y,10*o.f*dpr,0,7);ctx.fillStyle=acc;ctx.fill();\n    };\n    this.rafHero=requestAnimationFrame(frame);\n  }\n\n  spark(series,w,h){\n    const mn=Math.min(...series),mx=Math.max(...series),sp=(mx-mn)||1;\n    return series.map((p,i)=>`${i?'L':'M'}${(3+i/(series.length-1)*(w-6)).toFixed(1)},${(h-6-((p-mn)/sp)*(h-12)).toFixed(1)}`).join(' ');\n  }\n\n  renderVals(){\n    const s=this.state;\n    const usd=n=>'$'+n.toLocaleString('en-US',{maximumFractionDigits:0});\n    const up=s.delta>=0;\n    const layer=LAYERS[s.layer];\n    const net=NETS[s.net];\n    const env=ENVS[s.env];\n    const cd=CARDS[s.cardIx||0];\n    const dl=s.diveIx>=0?LAYERS[s.diveIx]:null;\n\n    return {\n      accentReadout:this.rgbText||'rgb(205, 251, 47)',\n      blockLabel:s.block?`${s.block.code} block #${s.block.height.toLocaleString()}`:'listening for blocks…',\n      blockColor:s.block?s.block.color:'var(--mut)',\n\n      pulse:[\n        {label:'Wallets connected',value:s.wallets.toLocaleString('en-US'),note:'unique owners holding a vault key',bar:'72%'},\n        {label:'Capital in flow',value:usd(s.capital),note:'value inside mandates currently armed',bar:'58%'},\n        {label:'Vaults deployed',value:s.vaults.toLocaleString('en-US'),note:'personal proxies cloned by the factory',bar:'41%'},\n        {label:'Cycles settled',value:s.cycles.toLocaleString('en-US'),note:'atomic routes that cleared their minimum',bar:'86%'}\n      ],\n      splitPolygon:'48%',splitArbitrum:'31%',splitBnb:'21%',\n\n      layerNav:LAYERS.map((l,i)=>({n:l.n,name:l.name,\n        bg:i===s.layer?'var(--acc)':'transparent',fg:i===s.layer?'var(--ink)':'var(--mut)',\n        select:()=>this.setState({layer:i})})),\n      current:{...layer,stats:mapStats(layer.stats)},\n      diveCurrent:()=>this.setState({diveIx:s.layer}),\n      diveVault:()=>this.setState({diveIx:0}),\n      diveMandate:()=>this.setState({diveIx:1}),\n      diveExecution:()=>this.setState({diveIx:2}),\n      diveInfinite:()=>this.setState({diveIx:5}),\n      diveOpen:s.diveIx>=0,\n      diveClose:()=>this.setState({diveIx:-1}),\n      divePrev:()=>this.shiftDive(-1),\n      diveNext:()=>this.shiftDive(1),\n      dive:dl?{...dl,stats:mapStats(dl.stats),\n        prevName:LAYERS[(s.diveIx-1+LAYERS.length)%LAYERS.length].name,\n        nextName:LAYERS[(s.diveIx+1)%LAYERS.length].name}:{stats:[],prevName:'',nextName:'',kicker:'',title:'',copy:'',note:''},\n\n      authorSteps:AUTHOR_STEPS,\n      authorEcon:AUTHOR_ECON,\n      assets:ASSETS,\n      walletFacts:WALLET_FACTS,\n      cardBg:cd.bg,cardBorder:cd.border,cardInk:cd.ink,cardMut:cd.mut,cardMark:cd.mark,cardName:cd.name,\n      cardStyles:CARDS.map((c,i)=>({name:c.name,\n        bg:i===s.cardIx?'var(--acc)':'rgba(21,24,22,.92)',\n        fg:i===s.cardIx?'var(--ink)':'var(--mut)',\n        border:i===s.cardIx?'transparent':'var(--line)',\n        select:()=>this.setState({cardIx:i})})),\n\n      envTabs:ENVS.map((e,i)=>({name:e.name,dot:e.color,\n        bg:i===s.env?e.color:'rgba(21,24,22,.92)',\n        fg:i===s.env?'#0b0d02':'var(--mut)',\n        border:i===s.env?'transparent':'var(--line)',\n        select:()=>this.setState({env:i})})),\n      env:{...env,fg2:env.color,border:`color-mix(in srgb,${env.color} 40%,var(--line))`},\n      state:STATES[env.key],\n      modeTabs:['Essential','Professional'].map((n,i)=>({name:n,\n        bg:i===s.mode?'var(--acc)':'var(--s2)',\n        fg:i===s.mode?'var(--ink)':'var(--mut)',\n        select:()=>this.setState({mode:i})})),\n      modeLabel:s.mode?'PROFESSIONAL':'ESSENTIAL',\n      chainColor:NETS[s.net].color,\n      ledger:LEDGER,\n      quickActions:QUICK,\n      deskCells:s.mode?[\n        {label:'Consolidated vault',value:usd(s.value),note:'Synthetic · no asset connected',color:'#f5f7f3'},\n        {label:'Scenario result',value:(up?'+':'')+'$'+Math.abs(s.value*s.delta/100).toFixed(2),note:'Unrealised, after costs',color:up?'var(--acc)':'var(--red)'},\n        {label:'Protocol PayFee',value:'50%',note:'Fixed per positive micro-operation',color:'var(--acc)'},\n        {label:'Guards armed',value:'2 / 8',note:'Veto slots in the mandate',color:'#f5f7f3'},\n        {label:'Quote age',value:'4s',note:'Maximum accepted: 12s',color:'#f5f7f3'},\n        {label:'Evidence',value:'0x4D…91',note:'Illustrative hash',color:'#f5f7f3'}\n      ]:[\n        {label:'Consolidated vault',value:usd(s.value),note:'Synthetic · no asset connected',color:'#f5f7f3'},\n        {label:'Scenario result',value:(up?'+':'')+'$'+Math.abs(s.value*s.delta/100).toFixed(2),note:'Unrealised, after costs',color:up?'var(--acc)':'var(--red)'},\n        {label:'Decision',value:'REJECT',note:'Guardrails active',color:'var(--red)'},\n        {label:'Environment',value:env.badge,note:'Nothing is signed here',color:env.color}\n      ],\n      gates:GATES.map(g=>({label:g.label,icon:g.ok?'✓':'✕',\n        bg:g.ok?'var(--acc)':'var(--red)',fg:g.ok?'var(--ink)':'#ffffff'})),\n      gateVerdict:'REJECT · below minimum',\n      gateColor:'var(--red)',\n      gateBorder:'color-mix(in srgb,var(--red) 45%,var(--line))',\n      deltaFg2:up?'var(--acc)':'var(--red)',\n\n      clock:s.clock,\n      phoneValue:'$'+s.value.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),\n      deskValue:usd(s.value),\n      phoneDelta:(up?'+':'')+s.delta.toFixed(2)+'% · live',\n      deskDelta:(up?'+':'')+s.delta.toFixed(2)+'%',\n      deltaBg:up?'var(--acc)':'var(--red)',\n      deltaFg:up?'var(--ink)':'#ffffff',\n      phonePath:this.spark(s.series,220,62),\n      deskPath:this.spark(s.series.slice(2),200,58),\n      feed:s.feed,\n\n      netNav:NETS.map((n,i)=>({name:n.name,code:n.code,sub:n.sub,dot:n.color,\n        bg:i===s.net?'var(--acc)':'rgba(21,24,22,.9)',fg:i===s.net?'var(--ink)':'var(--mut)',\n        border:i===s.net?'transparent':'var(--line)',\n        select:()=>this.setState({net:i})})),\n      net:{name:net.name,code:net.code,color:net.color,\n        copy:'Network selection organises the experience. In this build the figures are illustrative: a chain should only read as synced once a real source confirms its connection, freshness and scope.',\n        stateLabel:'illustrative',stateColor:'var(--amber)',stateBorder:'color-mix(in srgb,var(--amber) 40%,var(--line))',\n        meta:[{k:'chainId',v:String(net.chainId)},{k:'explorer',v:net.key==='polygon'?'PolygonScan':net.key==='arbitrum'?'Arbiscan':'BscScan'},\n              {k:'source',v:'local · static'},{k:'signing',v:'never'}],\n        contractsLabel:net.contracts.length?`TRIVIU contracts · ${net.contracts.length}`:'TRIVIU contracts',\n        contracts:net.contracts.map(([name,addr])=>({name,addr})),\n        empty:net.contracts.length===0}\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
